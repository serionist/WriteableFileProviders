# Build, test with coverage, and pack, on every pull request and every push to main. The emulator suites start their
# containers through Testcontainers, which needs Docker: present on the Linux runner, where WFP_REQUIRE_DOCKER makes a
# missing emulator fail the run instead of leaving its tests inconclusive. Live suites (TestCategory=Live) never run here.
# The Native AOT job publishes tests/WriteableFileProviders.Aot with native AOT and runs it (its README says why). The
# Physical jobs run the local disk provider's tests on macOS and on Linux on Arm64, which the others don't reach.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Build, test, coverage, pack (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WFP_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer versions the packages from the git history and tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore WriteableFileProviders.slnx --locked-mode
      - name: Build
        run: dotnet build WriteableFileProviders.slnx --no-restore -c Release
      - name: Test with coverage
        run: >-
          dotnet test --solution WriteableFileProviders.slnx --no-build -c Release
          --filter "TestCategory!=Live"
          --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.runsettings
          --results-directory artifacts/TestResults --report-trx
      - name: Coverage gate
        run: dotnet run eng/coverage-gate.cs -- artifacts/TestResults
      - name: Pack
        run: dotnet pack WriteableFileProviders.slnx --no-build -c Release -o artifacts/packages
      # The check release.yml runs, here on this commit's prerelease, so a change that breaks it (such as the upper bound
      # on dependencies between our packages, src/Directory.Build.targets) shows on its PR: every package at one version,
      # the one MinVer gave Common.
      - name: Check the packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          common=(artifacts/packages/WriteableFileProviders.Common.*.nupkg)
          if [ "${#common[@]}" -ne 1 ]; then
            echo "::error::Expected one WriteableFileProviders.Common package, found ${#common[@]}."
            exit 1
          fi
          version="${common[0]##*/WriteableFileProviders.Common.}"
          version="${version%.nupkg}"
          dotnet run eng/package-check.cs -- artifacts/packages "$version"
      # The same check on a stable release, which release.yml packs from a v* tag and nothing else here would: a stable
      # package may not have a prerelease dependency (NU5104), so a change that breaks only stable packs shows on its PR.
      # The version is this commit's prerelease without its suffix (2027.0.0-alpha.0.42 packs as 2027.0.0), through
      # MinVer's override, into a folder of its own that is not uploaded.
      - name: Pack and check a stable release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          common=(artifacts/packages/WriteableFileProviders.Common.*.nupkg)
          version="${common[0]##*/WriteableFileProviders.Common.}"
          version="${version%.nupkg}"
          stable="${version%%-*}"
          dotnet pack WriteableFileProviders.slnx --no-build -c Release -p:MinVerVersionOverride="$stable" \
            -o artifacts/stable-packages
          dotnet run eng/package-check.cs -- artifacts/stable-packages "$stable"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: artifacts/TestResults
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages

  aot:
    name: Native AOT (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The native AOT compiler links with clang and zlib. The runner image has them; this covers an image that
      # does not.
      - name: Native AOT prerequisites
        run: |
          if ! command -v clang >/dev/null || ! dpkg -s zlib1g-dev >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev
          fi
      # The emulators the app runs against, on loopback, at the versions the test fixtures pin. They start while the app
      # publishes.
      - name: Start Azurite and MinIO
        run: |
          docker run -d --name azurite -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          docker run -d --name minio -p 127.0.0.1:9000:9000 --user 0 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf server /data
      # Restored on its own: publish -r would restore every project for that runtime, which their lock files do not
      # hold.
      - name: Restore (locked)
        run: dotnet restore tests/WriteableFileProviders.Aot --locked-mode
      # Fails on any trim or AOT warning in the packages or the SDKs they call, but one folded IL2104
      # (tests/WriteableFileProviders.Aot/README.md).
      - name: Publish with native AOT
        run: dotnet publish tests/WriteableFileProviders.Aot --no-restore -c Release -r linux-x64 -o artifacts/aot
      - name: Wait for the emulators
        run: |
          for _ in $(seq 60); do
            if curl -sf http://127.0.0.1:9000/minio/health/ready >/dev/null && curl -s -o /dev/null http://127.0.0.1:10000/; then
              exit 0
            fi
            sleep 1
          done
          docker logs azurite; docker logs minio
          echo "::error::Azurite or MinIO did not start."
          exit 1
      - name: Run the native app
        env:
          WFP_AOT_AZURITE: 127.0.0.1:10000
          WFP_AOT_MINIO: 127.0.0.1:9000
        run: artifacts/aot/WriteableFileProviders.Aot

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore WriteableFileProviders.slnx --locked-mode
      - name: Build
        run: dotnet build WriteableFileProviders.slnx --no-restore -c Release
      # No Linux containers on Windows runners: the emulator suites are inconclusive here and run on Linux.
      - name: Test
        run: dotnet test --solution WriteableFileProviders.slnx --no-build -c Release --filter "TestCategory!=Live"

  physical:
    # Physical calls the C library itself, and its rules differ by system (case, names, links, permissions): its tests
    # run where the jobs above don't, on macOS and on Linux on Arm64.
    name: Physical (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
          - name: Linux, Arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore tests/WriteableFileProviders.Physical.Tests --locked-mode
      - name: Build
        run: dotnet build tests/WriteableFileProviders.Physical.Tests --no-restore -c Release
      - name: Test
        run: dotnet test --project tests/WriteableFileProviders.Physical.Tests --no-build -c Release --filter "TestCategory!=Live"
