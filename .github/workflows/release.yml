# The release: pushing a tag v<version> on main builds, tests and packs every package at <version> (MinVer reads the
# tag), checks them, pushes them to nuget.org and creates the GitHub release with the packages attached. A tag with a
# prerelease suffix (v2027.1.0-rc.1) makes a prerelease on both.
#
# What the maintainers configure once, in this order. A workflow that names an environment creates it, unprotected, the
# first time it runs, so the environment is protected before it holds a secret or nuget.org trusts it:
# 1. In GitHub, Settings > Environments > nuget:
#    - required reviewers: the maintainers, so a person approves every push to nuget.org after the tests pass;
#    - deployment branches and tags: tags matching v* only.
# 2. A tag ruleset on v*, so only the maintainers can create, move or delete a release tag.
# 3. Then the nuget environment's secret NUGET_USER: the nuget.org profile name (not the email) of the account that owns
#    the packages and the policy below.
# 4. Then, on nuget.org, signed in as the account that owns the WriteableFileProviders.* packages: Trusted Publishing >
#    a policy with repository owner "serionist", repository "WriteableFileProviders", workflow file "release.yml" and
#    environment "nuget". The policy covers every package that account owns.
#
# No long-lived API key exists anywhere: NuGet/login trades the job's OIDC token for a key that lives one hour.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # As in CI: the emulator suites run, and a missing emulator fails the release instead of being skipped.
      WFP_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer versions the packages from the git history and the tag; main must be there for the check below.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. A release is tagged on a commit of main."
            exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore WriteableFileProviders.slnx --locked-mode
      # ContinuousIntegrationBuild (also set on every GitHub Actions build by Directory.Build.props) makes the build
      # deterministic, with source paths in the symbols that SourceLink maps to this commit.
      - name: Build
        run: dotnet build WriteableFileProviders.slnx --no-restore -c Release -p:ContinuousIntegrationBuild=true
      - name: Test
        run: dotnet test --solution WriteableFileProviders.slnx --no-build -c Release --filter "TestCategory!=Live"
      - name: Pack
        run: >-
          dotnet pack WriteableFileProviders.slnx --no-build -c Release -p:ContinuousIntegrationBuild=true
          -o artifacts/packages
      # Every package at the tag's version, each provider on Common at that same version (D2).
      - name: Check the packages
        run: dotnet run eng/package-check.cs -- artifacts/packages "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  publish:
    name: Push to nuget.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The maintainers approve here: the environment's required reviewers, and the policy names this environment.
    environment: nuget
    permissions:
      # Trusted publishing: the OIDC token that NuGet/login trades for a short-lived API key.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Each .snupkg is pushed to the symbol server with the .nupkg beside it. --skip-duplicate makes a re-run after a
      # partial failure push only what is missing.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the release and uploads the packages to it.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease
