# The release: pushing a tag v<version> on main builds, tests with coverage and the coverage gate, and packs every
# package at <version> (MinVer reads the tag), checks them, pushes them to nuget.org and creates the GitHub release with
# the packages attached and the version's section of CHANGELOG.md as its notes. Nothing is pushed unless ci.yml
# concluded success on the tagged commit, which covers what this workflow does not run (the Windows build and tests, the
# Native AOT app, and Physical's tests on macOS and on Linux on Arm64). A tag with a prerelease suffix (v2027.1.0-rc.1)
# makes a prerelease on both. docs/releasing.md is the runbook.
#
# Setup: docs/releasing.md. No long-lived API key exists anywhere: NuGet/login trades the job's OIDC token for a key that
# lives one hour.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test, pack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # As in CI: the emulator suites run, and a missing emulator fails the release instead of being skipped.
      WFP_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer versions the packages from the git history and the tag; main must be there for the check below.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. A release is tagged on a commit of main."
            exit 1
          fi
      # A stable release's notes are its CHANGELOG.md section (the github-release job), so a stable tag needs one, dated:
      # a "## <version>" heading (or "## [<version>]") that no longer says unreleased, with something under it. It is
      # checked here, before the approval, so nothing is pushed without it. A prerelease may have none: its notes fall
      # back to its release's section, or to notes GitHub generates.
      - name: Check the changelog has a section for a stable version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) echo "$version is a prerelease: no changelog section required."; exit 0 ;; esac
          heading=$(awk -v version="$version" '
            /^## / { h = $2; gsub(/[][]/, "", h); if (h == version) { print; exit } }
          ' CHANGELOG.md)
          body=$(awk -v version="$version" '
            /^## / { if (found) exit; h = $2; gsub(/[][]/, "", h); if (h == version) { found = 1; next } }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$heading" ] || ! grep -q '[^[:space:]]' <<<"$body"; then
            echo "::error::CHANGELOG.md has no section for $version. Add one, dated, before tagging (docs/releasing.md)."
            exit 1
          fi
          if grep -qi 'unreleased' <<<"$heading"; then
            echo "::error::CHANGELOG.md's heading for $version still says unreleased: '$heading'. Date it before tagging."
            exit 1
          fi
          echo "CHANGELOG.md has a section for $version: $heading"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore WriteableFileProviders.slnx --locked-mode
      # ContinuousIntegrationBuild (also set on every GitHub Actions build by Directory.Build.props) makes the build
      # deterministic, with source paths in the symbols that SourceLink maps to this commit.
      - name: Build
        run: dotnet build WriteableFileProviders.slnx --no-restore -c Release -p:ContinuousIntegrationBuild=true
      # The tests and the gate as ci.yml runs them, on the commit that is released.
      - name: Test with coverage
        run: >-
          dotnet test --solution WriteableFileProviders.slnx --no-build -c Release
          --filter "TestCategory!=Live"
          --coverage --coverage-output-format cobertura --coverage-settings tests/coverage.runsettings
          --results-directory artifacts/TestResults
      - name: Coverage gate
        run: dotnet run eng/coverage-gate.cs -- artifacts/TestResults
      - name: Pack
        run: >-
          dotnet pack WriteableFileProviders.slnx --no-build -c Release -p:ContinuousIntegrationBuild=true
          -o artifacts/packages
      # Every package releases in lockstep: each at the tag's version, each provider on Common at that same version.
      - name: Check the packages
        run: dotnet run eng/package-check.cs -- artifacts/packages "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: error

  ci:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Reads the ci.yml runs of the tagged commit.
      actions: read
    steps:
      # ci.yml runs on every push to main, so the tagged commit has a run of its own: it must have concluded success,
      # its Windows, Native AOT and Physical jobs included, before anything is pushed. A run still going (a tag pushed
      # right after the merge) is waited for; a run that failed, or none at all, stops the release. Re-run this workflow
      # once CI is green.
      - name: Require a successful ci.yml run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 50 * 60))
          while :; do
            counts=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --branch main --event push --limit 20 --json status,conclusion \
              --jq '"\([.[] | select(.conclusion == "success")] | length) \([.[] | select(.status != "completed")] | length) \(length)"')
            read -r succeeded running total <<<"$counts"
            if [ "$succeeded" -gt 0 ]; then
              echo "ci.yml concluded success on $GITHUB_SHA."
              exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$running" -eq 0 ]; then
              echo "::error::ci.yml did not conclude success on $GITHUB_SHA. Fix main and tag a new commit, or re-run CI and then this workflow."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No successful ci.yml run on $GITHUB_SHA within 50 minutes ($total found, $running still running). Re-run this workflow once CI is green."
              exit 1
            fi
            echo "Waiting for ci.yml on $GITHUB_SHA ($total found, $running still running)..."
            sleep 30
          done

  publish:
    name: Push to nuget.org
    needs: [build, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The maintainers approve here: the environment's required reviewers, and the policy names this environment.
    environment: nuget
    permissions:
      # Trusted publishing: the OIDC token that NuGet/login trades for a short-lived API key.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Each .snupkg is pushed to the symbol server with the .nupkg beside it. --skip-duplicate makes a re-run after a
      # partial failure push only what is missing.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

  github-release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creates the release and uploads the packages to it.
      contents: write
    steps:
      # Only CHANGELOG.md, for the notes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages
      # The notes are the section of CHANGELOG.md headed with this version (## 2027.0.0, or ## [2027.0.0], with anything
      # after it), up to the next ## heading. A prerelease without a section of its own takes its release's
      # (v2027.0.0-rc.1 takes 2027.0.0's). Without either, GitHub generates notes from the merged pull requests.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          section() {
            awk -v version="$1" '
              /^## / { if (found) exit; heading = $2; gsub(/[][]/, "", heading); if (heading == version) { found = 1; next } }
              found { print }
            ' CHANGELOG.md
          }
          section "$version" > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || section "${version%%-*}" > release-notes.md
          if grep -q '[^[:space:]]' release-notes.md; then
            notes=(--notes-file release-notes.md)
          else
            echo "::warning::CHANGELOG.md has no section for $version; the release's notes are generated instead."
            notes=(--generate-notes)
          fi
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}" "${prerelease[@]}"
